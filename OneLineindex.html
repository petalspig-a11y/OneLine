<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneLine</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* 全局统一苹果苹方 / 系统无衬线字体 */
    * {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif !important;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      transition: background-color 0.3s ease, color 0.3s ease;
      letter-spacing: -0.01em;
    }

    .transition-custom {
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* 三种主题风格 */
    body.theme-light { background-color: #FAFAFA !important; color: #111111; }
    body.theme-light .text-muted { color: #737373; }
    body.theme-light .divider { border-color: #E5E5E5; }
    body.theme-light .hover-text:hover { color: #000000; opacity: 0.7; }
    body.theme-light #theme-btn { color: #111111; }

    body.theme-dark { background-color: #0A0A0A !important; color: #EDEDED; }
    body.theme-dark .text-muted { color: #8E8E93; }
    body.theme-dark .divider { border-color: #262626; }
    body.theme-dark .hover-text:hover { color: #FFFFFF; opacity: 0.7; }
    body.theme-dark #theme-btn { color: #FBBF24 !important; text-shadow: 0 0 10px rgba(251, 191, 36, 0.5); } 

    body.theme-melon { background-color: #E2EEDD !important; color: #182C13; }
    body.theme-melon .text-muted { color: #44603B; }
    body.theme-melon .divider { border-color: #C1D8B8; }
    body.theme-melon .hover-text:hover { color: #000000; opacity: 0.7; }
    body.theme-melon #theme-btn { color: #182C13; }

    .line-green { border-color: #6A8E51; }
    .text-green-accent { color: #4A7332; }
  </style>
</head>
<body id="app-body" class="theme-light min-h-screen flex flex-col justify-between p-6 sm:p-10 max-w-lg mx-auto selection:bg-emerald-200 selection:text-black">

  <header class="w-full flex items-center justify-between pb-4 border-b divider">
    <div class="flex items-center">
      <span class="text-xl font-bold tracking-tight">OneLine</span>
    </div>

    <div class="flex items-center space-x-4 text-xs font-normal select-none">
      <button onclick="cycleLang()" id="lang-btn" class="hover-text transition-custom cursor-pointer py-1" title="切换语言">
        EN / 中
      </button>

      <button id="theme-btn" onclick="cycleTheme()" class="hover-text transition-custom cursor-pointer py-1 text-sm leading-none">
        ○
      </button>
    </div>
  </header>

  <main class="w-full flex-1 flex flex-col justify-center my-8 space-y-12">

    <section class="space-y-4">
      <div class="text-center">
        <span id="i18n-anchor-sub" class="text-xs italic text-muted opacity-80">时间比你想象的短得多</span>
      </div>
      
      <div class="grid grid-cols-3 gap-4 text-sm pt-1">
        <button onclick="selectTimeAnchor('wash_face')" class="text-left py-2 hover-text transition-custom cursor-pointer">
          <div id="i18n-anchor-washface-name" class="font-medium">洗个脸</div>
          <div id="i18n-anchor-washface-time" class="text-xs text-muted">~ 1 分钟</div>
        </button>
        <button onclick="selectTimeAnchor('makeup')" class="text-left py-2 hover-text transition-custom cursor-pointer">
          <div id="i18n-anchor-makeup-name" class="font-medium">化个妆</div>
          <div id="i18n-anchor-makeup-time" class="text-xs text-muted">~ 10 分钟</div>
        </button>
        <button onclick="selectTimeAnchor('wash_hair')" class="text-left py-2 hover-text transition-custom cursor-pointer">
          <div id="i18n-anchor-washhair-name" class="font-medium">洗头吹头</div>
          <div id="i18n-anchor-washhair-time" class="text-xs text-muted">~ 10 分钟</div>
        </button>
      </div>

      <div class="pt-2 text-center">
        <button 
          onclick="handleQueryClick()" 
          class="text-xs text-muted hover-text transition-custom cursor-pointer py-1 border-b border-dashed border-neutral-400"
        >
          <span id="i18n-anchor-query-btn">🕐 估算耗时</span>
        </button>

        <div id="api-query-result" class="hidden text-xs text-muted pt-3 text-center transition-custom space-y-2">
          <div class="flex items-center justify-center space-x-3">
            <span>⏱️ <span id="i18n-time-prefix">预估耗时:</span> <span id="api-time-val" class="font-bold text-green-accent">~ 3 分钟</span></span>
            <button 
              id="start-timer-btn" 
              onclick="startTimerFromEstimate()" 
              class="hidden text-xs bg-neutral-200 dark:bg-neutral-800 hover:bg-neutral-300 dark:hover:bg-neutral-700 px-2.5 py-1 rounded transition-colors font-medium cursor-pointer"
            >
              ▶ <span id="i18n-timer-start">开始计时</span>
            </button>
          </div>

          <div id="active-timer-box" class="hidden pt-1 flex items-center justify-center space-x-3 text-xs">
            <span id="timer-display" class="font-mono text-sm font-bold text-green-accent">00:00</span>
            <button id="pause-timer-btn" onclick="togglePauseTimer()" class="hover-text underline cursor-pointer">暂停</button>
            <button onclick="resetTimer()" class="hover-text underline cursor-pointer" id="i18n-timer-reset">重置</button>
          </div>
        </div>
      </div>
    </section>

    <section class="space-y-3">
      <div class="flex items-baseline justify-between text-sm text-muted">
        <span id="i18n-thought-title" class="font-bold tracking-wider uppercase text-xs">碎片倾倒</span>
        <span id="i18n-thought-sub" class="text-xs opacity-70">卸下思绪即可</span>
      </div>
      
      <div class="py-3 border-y divider transition-custom space-y-4">
        <textarea 
          id="thought-input"
          rows="3" 
          placeholder="" 
          class="w-full text-xs bg-transparent resize-none focus:outline-none leading-relaxed"
        ></textarea>
        
        <div class="pt-2 flex justify-end items-center">
          <button 
            id="i18n-clear-btn"
            onclick="simpleClear()" 
            class="text-xs text-muted hover-text transition-custom cursor-pointer py-1"
          >
            清空
          </button>
        </div>
      </div>
    </section>

  </main>

  <footer id="i18n-footer" class="w-full text-center pt-4 border-t divider text-xs text-muted tracking-wide">
    /
  </footer>

  <div id="api-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white dark:bg-neutral-900 border divider p-6 max-w-sm w-full space-y-4 rounded-lg shadow-xl text-neutral-800 dark:text-neutral-100">
      <div class="flex justify-between items-center">
        <h3 id="i18n-modal-title" class="font-bold text-sm">DeepSeek API 设置</h3>
        <button onclick="closeApiModal()" class="text-xs text-muted hover-text">&times;</button>
      </div>
      <p id="i18n-api-tip" class="text-xs text-muted leading-relaxed">
        输入 DeepSeek API Key 即可进行精准时间估算（仅保存在本地，请注意保管好密钥，切勿泄露）。
      </p>
      
      <div class="space-y-2">
        <input 
          type="password" 
          id="deepseek-key-input" 
          placeholder="sk-xxxxxxxxxxxxxxxxxxxxxxxx" 
          class="w-full text-xs p-2 border divider bg-transparent rounded focus:outline-none"
        >
      </div>

      <div class="flex justify-end space-x-3 pt-2">
        <button id="i18n-modal-cancel" onclick="closeApiModal()" class="text-xs text-muted hover-text">取消</button>
        <button id="i18n-modal-save" onclick="saveApiKey()" class="text-xs bg-emerald-600 text-white px-3 py-1.5 rounded hover:bg-emerald-700 transition-colors font-bold">保存配置</button>
      </div>
    </div>
  </div>

  <script>
    let DEEPSEEK_API_KEY = localStorage.getItem('deepseek_key') || "";
    let estimatedMinutes = 0;
    let timerInterval = null;
    let totalSecondsLeft = 0;
    let isTimerPaused = false;

    function openApiModal() { document.getElementById('api-modal').classList.remove('hidden'); }
    function closeApiModal() { document.getElementById('api-modal').classList.add('hidden'); }

    function saveApiKey() {
      const val = document.getElementById('deepseek-key-input').value.trim();
      if (!val) return;
      DEEPSEEK_API_KEY = val;
      localStorage.setItem('deepseek_key', val);
      closeApiModal();
      executeApiQuery();
    }

    function handleQueryClick() {
      if (!DEEPSEEK_API_KEY) openApiModal();
      else executeApiQuery();
    }

    async function executeApiQuery() {
      const userInput = document.getElementById('thought-input').value.trim();
      if (!userInput) return;

      const resultBox = document.getElementById('api-query-result');
      const timeValEl = document.getElementById('api-time-val');
      const startBtn = document.getElementById('start-timer-btn');

      resetTimer();
      resultBox.classList.remove('hidden');
      startBtn.classList.add('hidden');
      timeValEl.innerText = currentLang === 'ZH' ? "⏳ 估算中..." : "⏳ Estimating...";

      try {
        const response = await fetch("https://api.deepseek.com/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${DEEPSEEK_API_KEY}`
          },
          body: JSON.stringify({
            model: "deepseek-chat",
            messages: [{ role: "system", content: `Estimate realistic low-friction time for task: "${userInput}". Return JSON with minute integer (e.g. 3) and string formatted time: {"minutes": 3, "time": "~ 3 min"}` }],
            response_format: { type: "json_object" }
          })
        });

        const data = await response.json();
        const resObj = JSON.parse(data.choices[0].message.content);
        
        estimatedMinutes = resObj.minutes || parseInt(resObj.time.replace(/[^0-9]/g, '')) || 3;
        timeValEl.innerText = resObj.time;
        startBtn.classList.remove('hidden');
      } catch (err) {
        estimatedMinutes = 5;
        timeValEl.innerText = currentLang === 'ZH' ? "~ 5 分钟" : "~ 5 mins";
        startBtn.classList.remove('hidden');
      }
    }

    /* 计时器相关逻辑 */
    function startTimerFromEstimate() {
      if (estimatedMinutes <= 0) return;
      totalSecondsLeft = estimatedMinutes * 60;
      isTimerPaused = false;
      document.getElementById('active-timer-box').classList.remove('hidden');
      document.getElementById('start-timer-btn').classList.add('hidden');
      updateTimerDisplay();

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (!isTimerPaused) {
          totalSecondsLeft--;
          if (totalSecondsLeft <= 0) {
            clearInterval(timerInterval);
            document.getElementById('timer-display').innerText = currentLang === 'ZH' ? "🎉 完成！" : "🎉 Done!";
            return;
          }
          updateTimerDisplay();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const m = Math.floor(totalSecondsLeft / 60).toString().padStart(2, '0');
      const s = (totalSecondsLeft % 60).toString().padStart(2, '0');
      document.getElementById('timer-display').innerText = `${m}:${s}`;
    }

    function togglePauseTimer() {
      isTimerPaused = !isTimerPaused;
      const pauseBtn = document.getElementById('pause-timer-btn');
      if (isTimerPaused) {
        pauseBtn.innerText = currentLang === 'ZH' ? "继续" : "Resume";
      } else {
        pauseBtn.innerText = currentLang === 'ZH' ? "暂停" : "Pause";
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      totalSecondsLeft = 0;
      isTimerPaused = false;
      document.getElementById('active-timer-box').classList.add('hidden');
      document.getElementById('pause-timer-btn').innerText = currentLang === 'ZH' ? "暂停" : "Pause";
      if (estimatedMinutes > 0) {
        document.getElementById('start-timer-btn').classList.remove('hidden');
      }
    }

    function simpleClear() {
      document.getElementById('thought-input').value = '';
      document.getElementById('api-query-result').classList.add('hidden');
      resetTimer();
    }

    // 主题控制
    const themes = [
      { name: 'theme-light', symbol: '○' },
      { name: 'theme-dark', symbol: '🌙' },
      { name: 'theme-melon', symbol: '🍈' }
    ];
    let currentThemeIdx = 0;

    function applyTheme(index) {
      document.body.className = themes[index].name + " min-h-screen flex flex-col justify-between p-6 sm:p-10 max-w-lg mx-auto selection:bg-emerald-200 selection:text-black";
      document.getElementById('theme-btn').textContent = themes[index].symbol;
    }

    function cycleTheme() {
      currentThemeIdx = (currentThemeIdx + 1) % themes.length;
      applyTheme(currentThemeIdx);
    }

    // 语言控制
    const translations = {
      ZH: {
        langBtn: "EN / 中",
        anchorSub: "时间比你想象的短得多",
        washfaceName: "洗个脸", washfaceTime: "~ 1 分钟",
        makeupName: "化个妆", makeupTime: "~ 10 分钟",
        washhairName: "洗头吹头", washhairTime: "~ 10 分钟",
        anchorQueryBtn: "🕐 估算耗时",
        timePrefix: "预估耗时:",
        timerStart: "开始计时",
        timerPause: "暂停",
        timerReset: "重置",
        thoughtTitle: "碎片倾倒", thoughtSub: "卸下思绪即可",
        placeholder: "",
        clearBtn: "清空",
        modalTitle: "DeepSeek API 设置",
        apiTip: "输入 DeepSeek API Key 即可进行精准时间估算（仅保存在本地，请注意保管好密钥，切勿泄露）。",
        modalCancel: "取消",
        modalSave: "保存配置",
        footer: "/"
      },
      EN: {
        langBtn: "中 / EN",
        anchorSub: "Time is shorter than you think",
        washfaceName: "Wash Face", washfaceTime: "~ 1 min",
        makeupName: "Quick Makeup", makeupTime: "~ 10 mins",
        washhairName: "Wash Hair", washhairTime: "~ 10 mins",
        anchorQueryBtn: "🕐 Time Estimation",
        timePrefix: "Est. Time:",
        timerStart: "Start Timer",
        timerPause: "Pause",
        timerReset: "Reset",
        thoughtTitle: "THOUGHT BOX", thoughtSub: "Dump fragments",
        placeholder: "",
        clearBtn: "Clear",
        modalTitle: "DeepSeek API Settings",
        apiTip: "Enter your DeepSeek API Key for time estimation (stored locally only. Please keep your key safe and do not share it).",
        modalCancel: "Cancel",
        modalSave: "Save Key",
        footer: "/"
      }
    };
    let currentLang = 'ZH';

    function cycleLang() {
      currentLang = currentLang === 'ZH' ? 'EN' : 'ZH';
      const t = translations[currentLang];
      document.getElementById('lang-btn').innerText = t.langBtn;
      document.getElementById('i18n-anchor-sub').innerText = t.anchorSub;
      document.getElementById('i18n-anchor-washface-name').innerText = t.washfaceName;
      document.getElementById('i18n-anchor-washface-time').innerText = t.washfaceTime;
      document.getElementById('i18n-anchor-makeup-name').innerText = t.makeupName;
      document.getElementById('i18n-anchor-makeup-time').innerText = t.makeupTime;
      document.getElementById('i18n-anchor-washhair-name').innerText = t.washhairName;
      document.getElementById('i18n-anchor-washhair-time').innerText = t.washhairTime;
      document.getElementById('i18n-anchor-query-btn').innerText = t.anchorQueryBtn;
      document.getElementById('i18n-time-prefix').innerText = t.timePrefix;
      document.getElementById('i18n-timer-start').innerText = t.timerStart;
      document.getElementById('pause-timer-btn').innerText = t.timerPause;
      document.getElementById('i18n-timer-reset').innerText = t.timerReset;
      document.getElementById('i18n-thought-title').innerText = t.thoughtTitle;
      document.getElementById('i18n-thought-sub').innerText = t.thoughtSub;
      document.getElementById('thought-input').placeholder = t.placeholder;
      document.getElementById('i18n-clear-btn').innerText = t.clearBtn;
      document.getElementById('i18n-modal-title').innerText = t.modalTitle;
      document.getElementById('i18n-api-tip').innerText = t.apiTip;
      document.getElementById('i18n-modal-cancel').innerText = t.modalCancel;
      document.getElementById('i18n-modal-save').innerText = t.modalSave;
      document.getElementById('i18n-footer').innerText = t.footer;
    }

    function selectTimeAnchor(type) {
      const names = { wash_face: "洗个脸", makeup: "化个妆", wash_hair: "洗头吹头" };
      document.getElementById('thought-input').value = names[type];
    }
  </script>
</body>
</html>
